<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pong Game</h1>
        
        <div class="score-board">
            <div class="score">
                <span class="label">Player</span>
                <span id="playerScore">0</span>
            </div>
            <div class="score">
                <span class="label">Computer</span>
                <span id="computerScore">0</span>
            </div>
        </div>

        <div id="gameContainer" class="game-container">
            <!-- Left Paddle (Player) -->
            <div id="playerPaddle" class="paddle player-paddle"></div>
            
            <!-- Right Paddle (Computer) -->
            <div id="computerPaddle" class="paddle computer-paddle"></div>
            
            <!-- Ball -->
            <div id="ball" class="ball"></div>
            
            <!-- Center Line -->
            <div class="center-line">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>

        <div class="controls">
            <p>Controls:</p>
            <p>🖱️ Mouse: Move paddle</p>
            <p>⬆️⬇️ Arrow Keys: Move paddle</p>
            <p>SPACE: Start/Pause</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
